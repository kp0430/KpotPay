<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-Pot Pay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="brand">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
      <path class="steam s1" d="M22 20c-5-5 5-8 0-14"/>
      <path class="steam s2" d="M32 20c-5-5 5-8 0-14"/>
      <path class="steam s3" d="M42 20c-5-5 5-8 0-14"/>
      <path class="pot" d="M8 30h48c0 15-9 26-24 26S8 45 8 30z"/>
      <rect class="pot" x="4" y="26" width="56" height="6" rx="3"/>
    </svg>
    <div>
      <h1>K-Pot Pay</h1>
      <p class="sub">Track your tip-outs and find your estimated pay.</p>
    </div>
  </header>

  <section id="authView" class="panel" style="margin-top:2rem;">
    <h2 id="authTitle">Log in</h2>
    <div id="nameRow" style="display:none;margin-bottom:.9rem;"><label for="a-name">Name</label><input id="a-name" type="text"></div>
    <div class="row">
      <div><label for="a-email">Email</label><input id="a-email" type="email"></div>
      <div><label for="a-password">Password</label><input id="a-password" type="password"></div>
    </div>
    <div style="display:flex;gap:.8rem;align-items:center;">
      <button id="authSubmit" onclick="submitAuth()">Log in</button>
      <button class="link" id="authToggle" onclick="toggleAuthMode()">Need an account? Register</button>
    </div>
    <div id="authStatus" class="status"></div>
  </section>

  <div id="appView" style="display:none;">
    <div class="userbar"><span id="whoami"></span><button class="link" onclick="logout()">Log out</button></div>
    <div class="divider"></div>

    <div class="panel">
      <h2 id="formTitle">Log a shift</h2>
      <div class="row3">
        <div><label for="f-date">Date</label><input id="f-date" type="date"></div>
        <div><label for="f-role">Role</label><select id="f-role"><option value="SERVER">Server</option><option value="BARTENDER">Bartender</option></select></div>
        <div><label for="f-hours">Hours worked</label><input id="f-hours" type="number" step="0.01" placeholder="6.5"></div>
      </div>
      <div id="foodCategories">
        <label>Food sales</label>
        <div class="row4">
          <div><label for="f-kl">Kids lunch</label><input id="f-kl" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div><label for="f-kd">Kids dinner</label><input id="f-kd" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div><label for="f-al">Adult lunch</label><input id="f-al" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div><label for="f-ad">Adult dinner</label><input id="f-ad" type="number" step="0.01" min="0" placeholder="0.00"></div>
        </div>
        <div class="foodtotal">Food total: <span id="foodTotal">0.00</span></div>
      </div>
      <div id="barCategories">
        <label>Bar sales</label>
        <div class="row3">
          <div><label for="f-bb">Bar beverage</label><input id="f-bb" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div><label for="f-bo">Boba</label><input id="f-bo" type="number" step="0.01" min="0" placeholder="0.00"></div>
          <div><label for="f-ju">Juice</label><input id="f-ju" type="number" step="0.01" min="0" placeholder="0.00"></div>
        </div>
        <div class="foodtotal">Bar total: <span id="barTotal">0.00</span></div>
      </div>
      <div class="row">
        <div><label for="f-tips">Tips</label><input id="f-tips" type="number" step="0.01" placeholder="0.00"></div>
      </div>
      <div style="display:flex;gap:.6rem;">
        <button onclick="submitShift()" id="submitBtn">Save shift</button>
        <button class="secondary" onclick="resetForm()" id="cancelBtn" style="display:none;">Cancel edit</button>
      </div>
      <div id="formStatus" class="status"></div>
    </div>

    <div class="divider"></div>

    <div class="panel">
      <h2>Shifts</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>Date</th><th>Role</th><th>Food</th><th>Bar</th><th>Tips</th><th>Tip-out</th><th>Net</th><th></th></tr></thead>
        <tbody id="shiftsBody"></tbody>
      </table></div>
      <div id="shiftsEmpty" class="empty" style="display:none;">No shifts yet.</div>
      <div id="listStatus" class="status"></div>
    </div>

    <div class="divider"></div>

    <div class="panel">
      <h2>Check pay for a period</h2>
      <div class="row">
        <div><label for="s-start">Start date</label><input id="s-start" type="date"></div>
        <div><label for="s-end">End date</label><input id="s-end" type="date"></div>
      </div>
      <button onclick="getSummary()">Calculate</button>
      <div id="summaryStatus" class="status"></div>
      <div id="summaryResult"></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
