<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Tip Ledger</h1>
  <p class="sub">Log shifts, track tip-out owed, and check pay for any date range.</p>

  <div class="divider"></div>

  <div class="panel">
    <h2>User</h2>
    <div class="row">
      <div class="field">
        <label for="userId">User ID</label>
        <input id="userId" type="number" placeholder="1" value="1">
      </div>
      <div class="button-column align-end">
        <button onclick="loadShifts()">Load shifts</button>
      </div>
    </div>
    <div id="userStatus" class="status"></div>
  </div>

  <div class="divider"></div>

  <div class="panel">
    <h2 id="formTitle">Log a shift</h2>
    <div class="row3">
      <div class="field">
        <label for="f-date">Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="field">
        <label for="f-role">Role</label>
        <select id="f-role">
          <option value="SERVER">Server</option>
          <option value="BARTENDER">Bartender</option>
        </select>
      </div>
      <div class="field">
        <label for="f-hours">Hours worked</label>
        <input id="f-hours" type="number" step="0.01" placeholder="6.5">
      </div>
    </div>
    <div class="row3">
      <div class="field">
        <label for="f-food">Food sales</label>
        <input id="f-food" type="number" step="0.01" placeholder="leave blank if 0">
      </div>
      <div class="field">
        <label for="f-bar">Bar sales</label>
        <input id="f-bar" type="number" step="0.01" placeholder="leave blank if 0">
      </div>
      <div class="field">
        <label for="f-tips">Tips</label>
        <input id="f-tips" type="number" step="0.01" placeholder="0.00">
      </div>
    </div>
    <div class="button-row">
      <button onclick="submitShift()" id="submitBtn">Save shift</button>
      <button class="secondary hidden" onclick="resetForm()" id="cancelBtn">Cancel edit</button>
    </div>
    <div id="formStatus" class="status"></div>
  </div>

  <div class="divider"></div>

  <div class="panel">
    <h2>Shifts</h2>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Role</th>
          <th>Food</th>
          <th>Bar</th>
          <th>Tips</th>
          <th>Tip-out</th>
          <th>Net</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="shiftsBody"></tbody>
    </table>
    <div id="shiftsEmpty" class="empty hidden">No shifts loaded yet.</div>
  </div>

  <div class="divider"></div>

  <div class="panel">
    <h2>Check pay for a period</h2>
    <div class="row">
      <div class="field">
        <label for="s-start">Start date</label>
        <input id="s-start" type="date">
      </div>
      <div class="field">
        <label for="s-end">End date</label>
        <input id="s-end" type="date">
      </div>
    </div>
    <button onclick="getSummary()">Calculate</button>
    <div id="summaryStatus" class="status"></div>
    <div id="summaryResult"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
