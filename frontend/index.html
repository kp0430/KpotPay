<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tip Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <h1>Tip Ledger</h1>
  <p class="sub">Log shifts, track tip-out owed, and check pay for any date range.</p>

  <section id="authView" class="panel" style="margin-top:2rem;">
    <h2 id="authTitle">Log in</h2>
    <div id="nameRow" style="display:none;margin-bottom:.9rem;"><label for="a-name">Name</label><input id="a-name" type="text"></div>
    <div class="row">
      <div><label for="a-email">Email</label><input id="a-email" type="email"></div>
      <div><label for="a-password">Password</label><input id="a-password" type="password"></div>
    </div>
    <div style="display:flex;gap:.8rem;align-items:center;">
      <button id="authSubmit" onclick="submitAuth()">Log in</button>
      <button class="link" id="authToggle" onclick="toggleAuthMode()">Need an account? Register</button>
    </div>
    <div id="authStatus" class="status"></div>
  </section>

  <div id="appView" style="display:none;">
    <div class="userbar"><span id="whoami"></span><button class="link" onclick="logout()">Log out</button></div>
    <div class="divider"></div>

    <div class="panel">
      <h2 id="formTitle">Log a shift</h2>
      <div class="row3">
        <div><label for="f-date">Date</label><input id="f-date" type="date"></div>
        <div><label for="f-role">Role</label><select id="f-role"><option value="SERVER">Server</option><option value="BARTENDER">Bartender</option></select></div>
        <div><label for="f-hours">Hours worked</label><input id="f-hours" type="number" step="0.01" placeholder="0"></div>
      </div>
      <div class="row3">
        <div><label for="f-food">Food sales</label><input id="f-food" type="number" step="0.01" placeholder="leave blank if 0"></div>
        <div><label for="f-bar">Bar sales</label><input id="f-bar" type="number" step="0.01" placeholder="leave blank if 0"></div>
        <div><label for="f-tips">Tips</label><input id="f-tips" type="number" step="0.01" placeholder="Credit + Cash"></div>
      </div>
      <div style="display:flex;gap:.6rem;">
        <button onclick="submitShift()" id="submitBtn">Save shift</button>
        <button class="secondary" onclick="resetForm()" id="cancelBtn" style="display:none;">Cancel edit</button>
      </div>
      <div id="formStatus" class="status"></div>
    </div>

    <div class="divider"></div>

    <div class="panel">
      <h2>Shifts</h2>
      <table>
        <thead><tr><th>Date</th><th>Role</th><th>Food</th><th>Bar</th><th>Tips</th><th>Tip-out</th><th>Net</th><th></th></tr></thead>
        <tbody id="shiftsBody"></tbody>
      </table>
      <div id="shiftsEmpty" class="empty" style="display:none;">No shifts yet.</div>
      <div id="listStatus" class="status"></div>
    </div>

    <div class="divider"></div>

    <div class="panel">
      <h2>Check pay for a period</h2>
      <div class="row">
        <div><label for="s-start">Start date</label><input id="s-start" type="date"></div>
        <div><label for="s-end">End date</label><input id="s-end" type="date"></div>
      </div>
      <button onclick="getSummary()">Calculate</button>
      <div id="summaryStatus" class="status"></div>
      <div id="summaryResult"></div>
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
